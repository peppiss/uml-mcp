version: '3.8'

services:
  uml-mcp-server:
    build:
      context: ..
      dockerfile: docker-remote-setup/Dockerfile
    image: peppiss/docker-repo:lmg-mcpserver-diagrams
    container_name: uml-mcp-remote-server
    ports:
      - "8000:8000"
    volumes:
      # Mount output directory for diagram files
      - uml_output:/app/output
      # Mount logs directory
      - uml_logs:/app/logs
      # Optional: Mount custom PlantUML themes or config
      - ./config:/app/config:ro
    environment:
      - UML_MCP_OUTPUT_DIR=/app/output
      - PLANTUML_JAR_PATH=/opt/plantuml.jar
      - LOG_LEVEL=INFO
      - CORS_ORIGINS=*
      # Security: In production, specify allowed origins
      # - CORS_ORIGINS=https://your-claude-client.com,https://another-client.com
    command: ["/bin/bash", "-c", "ls -la /app/ && /app/start-remote-server.sh"]
    restart: unless-stopped
    networks:
      - uml-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.uml-mcp.rule=Host(`uml-mcp.localhost`)"
      - "traefik.http.services.uml-mcp.loadbalancer.server.port=8000"

  # # Optional: Reverse proxy for production deployment
  # traefik:
