networks:
  uml-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16

volumes:
  uml_output:
    driver: local
  uml_logs:
    driver: local
  letsencrypt:
    driver: local
  prometheus_data:
    driver: local